[project]
name = "vac-protocol"
version = "0.1.0"
description = "VAC — Verifiable Agent Claims: capability evidence bundles with offline structural verification and issuer-replayable semantics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Erik Hill"}]

[project.scripts]
vac-verify = "vac.verify:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vac*"]
