name: vac
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest tests/ -q

  refusal-coverage:
    # The tamper fixtures prove the verifier CAN refuse. They do not prove each
    # refusal is tested: at one point 80 of 119 could be deleted with every
    # fixture still green. This job mutates each refusal and fails if the score
    # drops. Raise the floor when it rises; never lower it to make a build pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The score is only comparable if the suite is. Without these checkouts
      # the real-bundle tests SKIP, four mutants stop being caught, and the
      # denominator changes -- a mutation score that depends on what happens
      # to be on the machine is the same host-dependence class this verifier
      # exists to refuse. Check them out so CI measures what a developer does.
      - uses: actions/checkout@v4
        with: {repository: egnaro9/crashkit, path: _issuers/crashkit}
      - uses: actions/checkout@v4
        with: {repository: egnaro9/evalmut, path: _issuers/evalmut}
      - uses: actions/checkout@v4
        with: {repository: egnaro9/model-drift, path: _issuers/model-drift}
      - run: pip install -e ".[test]"
      - env:
          VAC_CRASHKIT_CHECKOUT: _issuers/crashkit/vac
          VAC_EVALMUT_CHECKOUT: _issuers/evalmut/vac
          VAC_MODELDRIFT_CHECKOUT: _issuers/model-drift/vac
        run: python tools/mutation_sweep.py --floor 0.99

  invalidation-liveness:
    # The verifier must prove it can both pass and BLOCK: the committed
    # valid bundle verifies clean, and every committed tampered variant
    # must be refused. A gate that never fires certifies nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: valid bundle verifies clean
        run: python -m vac.verify fixtures/valid
      - name: every tampered bundle is refused
        run: |
          set -e
          for d in fixtures/tamper-*; do
            if python -m vac.verify "$d"; then
              echo "LIVENESS FAILURE: $d verified clean — the gate cannot block"
              exit 1
            fi
          done
      - name: fixtures regenerate byte-identically
        run: |
          python fixtures/make_fixtures.py
          git diff --exit-code fixtures/
